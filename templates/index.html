<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magyar Politika</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="top" class="topbar"></header>
  <main>
    <section class="layout">
      <div class="window map-window">
        <div class="titlebar">THE REPUBLIC — COUNTY MAP</div>
        <canvas id="map" width="420" height="300" aria-label="Map of Hungarian counties"></canvas>
        <div id="info" class="county-info">Select a county to inspect its profile.</div>
        <div class="map-legend"><span></span> County winner · simplified game visualization</div>
      </div>
      <section id="panel" class="window side-panel" aria-live="polite"></section>
    </section>
    <section id="log" class="window event-log" aria-live="polite"></section>
  </main>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Game dialog"></div>
  <script src="/static/game.js" defer></script>
</body>
</html>
